<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hometron">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111418'/%3E%3Cpath d='M6 16 16 7l10 9v10H6z' fill='none' stroke='%235aa9ff' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>hometron</title>
<style>
  :root { color-scheme: dark; --bg:#111418; --card:#1b2027; --line:#2a313b; --text:#e6e9ee; --dim:#8b95a3;
          --accent:#5aa9ff; --warn:#ffb454; --heat:#ff7a59; --cool:#59b6ff; --ok:#46c47e; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text);
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  header .status { color:var(--dim); font-size:13px; margin-left:auto; display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.on { background:var(--ok); } .dot.off { background:var(--bad); }

  /* Phones: one column in order of use (controls, what happened, cameras, the rest).
     Desktop: cameras + the house at a glance on the left, controls + activity on the right. */
  main { display:flex; flex-direction:column; gap:16px; padding:16px; }
  main > .col { display:contents; }
  #quick { order:1; } #feedsec { order:2; } #camsec { order:3; } #glance { order:4; }
  @media (min-width:1000px) {
    main { display:grid; grid-template-columns:minmax(0, 2fr) minmax(320px, 1fr); align-items:start; }
    main > .col { display:flex; flex-direction:column; gap:16px; min-width:0; }
    #glance { grid-template-columns:1fr 1fr; align-items:start; }
    #glance > .wide { grid-column:1 / -1; }
    /* Controls above the cameras (thermostat on the right); Activity gets the whole right
       column and stays in view while the left side scrolls. */
    #quick { grid-template-columns:1fr 1fr; grid-auto-flow:dense; align-items:start; }
    #quick > .thermo { grid-column:2; grid-row:span 4; }
    #quick > :not(.thermo) { grid-column:1; }
    main > .col:last-child { position:sticky; top:73px; height:calc(100vh - 89px); }
    #feedsec { flex:1; min-height:0; display:flex; flex-direction:column; }
    #feedsec .feed { flex:1; max-height:none; }
    /* Cameras: the first (the doorbell) big, the rest four to its right, then rows of four. */
    .cams { grid-template-columns:repeat(4, minmax(0, 1fr)) !important; }
    .cams > .cam:first-child:nth-last-child(n+3) { grid-column:span 2; grid-row:span 2; display:flex; flex-direction:column; }
    .cams { align-items:start; }
    .cams > .cam:first-child:nth-last-child(n+3) { align-self:stretch; }
    .cams > .cam:first-child:nth-last-child(n+3) .view { flex:1; aspect-ratio:auto; min-height:0; }
    .cams > .cam:first-child:nth-last-child(n+3) .view > :is(img, video) { position:absolute; inset:0; }
  }
  #quick { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); }
  #glance { display:grid; gap:12px; }
  #glance:empty { display:none; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .dim { color:var(--dim); font-size:12px; }
  button { background:#26303b; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer; touch-action:manipulation; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button.on { border-color:var(--accent); background:#1d3550; }
  button.armed { background:#5a1f1f; border-color:var(--bad); }
  button.icon { padding:6px 10px; }

  /* garage */
  .garage { padding:14px; display:flex; align-items:center; gap:14px; }
  .garage .glyph { width:52px; height:52px; border-radius:12px; display:grid; place-items:center; font-size:26px; background:#222a33; flex:none; }
  .garage.open .glyph { background:#4a2d12; } .garage.closed .glyph { background:#173326; }
  .garage .state { font-size:20px; font-weight:600; }
  .garage.open .state { color:var(--warn); } .garage.closed .state { color:var(--ok); }
  .garage .grow { flex:1; min-width:0; }
  .garage .problem { color:var(--bad); font-size:12px; margin-top:2px; }
  .garage.nosensor { display:flex; align-items:center; gap:12px; padding:10px 12px; }
  .garage .gview { position:relative; width:112px; flex:none; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; display:grid; place-items:center; cursor:pointer; font-size:11px; text-align:center; }
  .garage .gview img { width:100%; height:100%; object-fit:cover; display:block; }
  .garage .gview .badge { top:auto; bottom:3px; left:3px; font-size:10px; padding:1px 4px; }
  .garage .gbar { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .garage .name { font-weight:600; }
  .cam .snap { display:inline-flex; } .cam.live .snap { display:none; }
  .cam.busy .view::after { content:'grabbing a still…'; position:absolute; bottom:8px; right:10px; font-size:12px; color:#c9d1db; }

  /* thermostat */
  .thermo { padding:14px; }
  .thermo .top { display:flex; align-items:baseline; gap:10px; }
  .thermo .now { font-size:44px; font-weight:300; line-height:1; }
  .thermo .act.heating { color:var(--heat); } .thermo .act.cooling { color:var(--cool); }
  .sp { display:flex; align-items:center; justify-content:space-between; margin:10px 0 0; }
  .sp .val { font-size:22px; min-width:70px; text-align:center; }
  .sp.heat .val { color:var(--heat); } .sp.cool .val { color:var(--cool); }
  .sp button { width:44px; height:44px; font-size:20px; padding:0; }
  .modes { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }

  .hist { margin-top:12px; }
  .hist svg { width:100%; height:90px; display:block; }
  .hist .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--dim); margin-top:4px; }
  .hist .legend i { display:inline-block; width:10px; height:3px; border-radius:2px; vertical-align:middle; margin-right:4px; }

  /* laundry */
  .laundry { padding:12px 14px; display:flex; align-items:center; gap:12px; }
  .laundry .glyph { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:22px; background:#222a33; flex:none; }
  .laundry.active .glyph { background:#1d3550; } .laundry.done .glyph { background:#173326; }
  .laundry .state { font-weight:600; } .laundry.done .state { color:var(--ok); } .laundry.active .state { color:var(--accent); }
  .laundry .grow { flex:1; min-width:0; }

  /* at a glance */
  .wx { padding:14px; }
  .wx .top { display:flex; align-items:baseline; gap:10px; }
  .wx .now { font-size:36px; font-weight:300; line-height:1; }
  .wx .periods { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:6px; margin-top:12px; }
  .wx .p { background:#202731; border-radius:8px; padding:6px 8px; font-size:12px; }
  .wx .p b { display:block; font-size:16px; font-weight:500; }
  .wx .p.night b { color:var(--cool); }
  .cal { padding:12px 14px; }
  .cal .d { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin:10px 0 4px; }
  .cal .d:first-child { margin-top:0; }
  .cal .e { display:flex; gap:10px; padding:3px 0; font-size:14px; }
  .cal .e .t { color:var(--dim); width:62px; flex:none; font-size:12px; padding-top:2px; }
  .cal .e.chore { color:var(--warn); }
  .cal .e.past { opacity:.45; }
  .stat { display:flex; gap:8px; flex-wrap:wrap; }
  .stat .card { padding:10px 12px; flex:1 1 150px; min-width:0; }
  .stat .k { font-size:12px; color:var(--dim); display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .stat .v { font-weight:600; margin-top:2px; }
  .stat .v.bad { color:var(--bad); } .stat .v.ok { color:var(--ok); } .stat .v.warn { color:var(--warn); }
  .stat button { padding:2px 8px; font-size:12px; }
  .ink { display:flex; gap:6px; margin-top:6px; align-items:flex-end; }
  .ink .bar { width:16px; height:30px; background:#202731; border:1px solid #3a4350; border-radius:3px; position:relative; overflow:hidden; }
  .ink .bar span { position:absolute; left:0; right:0; bottom:0; }
  .setup { font-size:12px; color:var(--dim); }
  .path { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-top:6px; font-size:12px; }
  .path .hop { padding:2px 7px; border-radius:999px; background:#202731; white-space:nowrap; }
  .path .hop.ok { color:var(--ok); } .path .hop.slow { color:var(--warn); } .path .hop.down { color:var(--bad); background:#3a1f22; }
  .path .arr { color:var(--dim); }
  .stat .card.wide { flex-basis:100%; }
  .stat a { color:var(--accent); text-decoration:none; font-size:12px; }
  #nethealth { margin-bottom:18px; }
  .nh-top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; }
  .nh-top .big { font-size:18px; font-weight:600; } .nh-top .big.ok { color:var(--ok); } .nh-top .big.bad { color:var(--bad); }
  .nh-grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); margin-top:12px; }
  .nh-grid .card { padding:12px 14px; }
  .nh-grid h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); font-weight:500; }
  .nh-chart svg { width:100%; height:120px; display:block; }
  .kv { display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:13px; border-bottom:1px solid var(--line); }
  .kv:last-child { border-bottom:0; }
  .kv .dim { font-size:12px; }
  .warnc { color:var(--warn); } .badc { color:var(--bad); } .okc { color:var(--ok); }

  /* cameras */
  .cams { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
  .cam .view { position:relative; aspect-ratio:16/9; background:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cam video, .cam img { width:100%; height:100%; object-fit:cover; display:block; }
  .cam .view .play { position:absolute; width:56px; height:56px; border-radius:50%; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); display:grid; place-items:center; font-size:22px; padding-left:4px; }
  .cam .view .vhint { position:absolute; bottom:8px; color:#c9d1db; font-size:12px; }
  .cam.live .view .play, .cam.live .view .vhint { display:none; }
  .cam .bar { display:flex; align-items:center; gap:8px; padding:8px 10px; }
  .cam .bar .grow { flex:1; min-width:0; }
  .cam .name { font-weight:600; }
  .cam .ctl { display:none; gap:6px; } .cam.live .ctl { display:flex; }
  .badge { position:absolute; top:8px; left:8px; color:#fff; font-size:11px; padding:2px 6px; border-radius:4px; font-weight:700; background:rgba(0,0,0,.6); }
  .badge.live { background:#c0392b; }
  .err { color:var(--bad); font-size:12px; padding:0 10px 8px; }
  .err:empty { display:none; }

  /* feed */
  .chips { margin-left:auto; display:flex; gap:4px; }
  .chips button { padding:2px 10px; font-size:12px; text-transform:none; letter-spacing:0; border-radius:999px; }
  .feed { display:flex; flex-direction:column; gap:6px; max-height:75vh; overflow:auto; padding:8px; }
  @media (max-width:999px) { .feed { max-height:440px; } }
  @media (max-width:640px) {
    .cams { grid-template-columns:1fr 1fr !important; gap:8px !important; }
    .cam.live { grid-column:1 / -1; }
    .cam .bar { padding:6px 8px; } .cam .name { font-size:13px; } .cam .sub { font-size:11px; }
    .cam .snap { display:none; } .cam .view .play { width:40px; height:40px; font-size:16px; }
    .cam .view .vhint { display:none; } .badge { font-size:10px; }
    main { padding:10px; gap:12px; }
  }
  .day { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin:8px 4px 2px; }
  .day:first-child { margin-top:0; }
  .ev { display:flex; gap:10px; align-items:center; padding:6px; border-radius:8px; }
  .ev:hover { background:#202731; }
  .ev .thumb { width:96px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; background:#000; flex:none; display:grid; place-items:center; font-size:22px; position:relative; }
  .ev .thumb.media { cursor:pointer; }
  .ev .thumb.icon { width:40px; height:40px; aspect-ratio:auto; border-radius:50%; background:#222a33; font-size:18px; margin:0 28px; }
  .ev .thumb .tag { position:absolute; bottom:3px; right:4px; font-size:10px; background:rgba(0,0,0,.6); padding:0 4px; border-radius:3px; }
  .ev .grow { flex:1; min-width:0; }
  .ev .kind { font-weight:600; }
  .ev .kind.chime, .ev .kind.opened, .ev .kind.reminder { color:var(--warn); } .ev .kind.done { color:var(--ok); } .ev .kind.person { color:var(--accent); } .ev .kind.closed { color:var(--ok); }
  .ev .when { color:var(--dim); font-size:12px; text-align:right; white-space:nowrap; }
  .empty { color:var(--dim); font-size:13px; padding:10px; }

  dialog { padding:0; border:0; background:#000; max-width:min(96vw, 1100px); border-radius:12px; }
  dialog::backdrop { background:rgba(0,0,0,.8); }
  dialog video, dialog img { display:block; width:100%; max-height:85vh; }
  dialog .cap { color:var(--dim); font-size:13px; padding:8px 12px; background:var(--card); display:flex; justify-content:space-between; }
  nav { display:flex; gap:4px; margin-left:8px; }
  nav a { color:var(--dim); text-decoration:none; padding:4px 10px; border-radius:999px; font-size:13px; }
  nav a.on { color:var(--text); background:#26303b; }
  #netview { padding:16px; max-width:1100px; }
  #fleetview { padding:16px; max-width:1200px; display:flex; flex-direction:column; gap:12px; }
  #fleetview h2 { margin:8px 0 0; }
  .fsum { padding:14px; display:flex; flex-wrap:wrap; gap:10px 28px; align-items:center; }
  .fsum .big { font-size:20px; font-weight:600; flex:1 1 260px; } .fsum .big.ok { color:var(--ok); } .fsum .big.bad { color:var(--bad); }
  .fsum .facts { display:flex; gap:24px; flex-wrap:wrap; font-size:13px; }
  .fsum details { flex-basis:100%; } .fsum ul { margin:6px 0 0; padding-left:18px; }
  .sugg .s { display:flex; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; align-items:baseline; }
  .sugg .s:last-child { border-bottom:0; }
  .lvl { font-size:11px; font-weight:700; text-transform:uppercase; padding:2px 7px; border-radius:4px; flex:none; width:44px; text-align:center; }
  .lvl.kill, .lvl.fix { background:#4a1d1d; color:#ffb4b4; } .lvl.trim { background:#4a3612; color:#ffd58a; } .lvl.check { background:#1d3550; color:#a8d0ff; }
  .strip { display:flex; gap:1px; height:18px; min-width:150px; } .strip i { flex:1; border-radius:1px; background:var(--ok); }
  .strip i.none { background:#2a323c; } .strip i.slow { background:var(--warn); } .strip i.down { background:var(--bad); }
  table.fleet tr.down td:first-child a { color:var(--bad); }
  .invgrid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 520px), 1fr)); align-items:start; }
  .inv .k { display:flex; justify-content:space-between; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; flex-wrap:wrap; }
  .inv tr.infra td { opacity:.55; }
  @media (max-width:700px) { table.fleet th:nth-child(4), table.fleet td:nth-child(4), table.fleet th:nth-child(6), table.fleet td:nth-child(6) { display:none; } }
  .netbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .netbar .dim { flex:1; font-size:13px; }
  .hint { border:1px solid var(--line); border-left:3px solid var(--warn); background:var(--card); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:13px; }
  .hint.good { border-left-color:var(--ok); }
  table.net { width:100%; border-collapse:collapse; font-size:13px; }
  table.net th { text-align:left; color:var(--dim); font-weight:500; font-size:12px; padding:8px 10px; border-bottom:1px solid var(--line); }
  table.net td { padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.net tr:last-child td { border-bottom:0; }
  table.net .mono { font-family:ui-monospace, Menlo, monospace; font-size:12px; color:var(--dim); }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:4px; background:#26303b; color:var(--dim); margin-left:6px; }
  .tag.tw { background:#4a2d12; color:var(--warn); font-weight:700; }
  .tag.rt { background:#1d3550; color:var(--accent); }
  @media (max-width:700px) { table.net .mac { display:none; } }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#3a1f22; border:1px solid var(--bad); color:#ffd7d7; padding:10px 14px; border-radius:10px; font-size:13px; max-width:90vw; display:none; z-index:10; }
</style>
</head>
<body>
<header><h1>hometron</h1><nav><a href="#" data-view="home">Home</a><a href="#network" data-view="network">Network</a><a href="#fleet" data-view="fleet">Fleet</a></nav><span class="status"><button id="bell" class="icon" title="Doorbell and person alerts on this device">🔕</button><span id="status">loading…</span><span class="dot" id="dot" title="live updates"></span></span></header>
<main>
  <div class="col">
  <section id="quick"></section>
  <section id="camsec"><h2>Cameras <span class="chips"><button id="snapall" title="Grab a fresh still from every camera">📷 Refresh stills</button></span></h2><div class="cams" id="cams"></div></section>
  <section id="glance"></section>
  </div>
  <div class="col">
  <section id="feedsec">
    <h2>Activity <span class="chips"><button data-f="key" class="on">Important</button><button data-f="all">All</button></span></h2>
    <div class="card feed" id="feed"><div class="empty">No events yet.</div></div>
  </section>
  </div>
</main>
<div id="netview" hidden>
  <div id="nethealth"></div>
  <h2>Devices on this network</h2>
  <div class="netbar">
    <div id="netsum" class="dim">Scanning…</div>
    <button id="rescan">Scan again</button>
  </div>
  <div id="nethint"></div>
  <div class="card"><table class="net"><thead><tr><th>Device</th><th>IP</th><th class="mac">MAC</th><th>Seen</th></tr></thead><tbody id="nethosts"></tbody></table></div>
  <h2 style="margin-top:18px">Not answering now <span class="dim" style="text-transform:none;letter-spacing:0">seen in the last 14 days</span></h2>
  <div class="card"><table class="net"><tbody id="netgone"></tbody></table></div>
</div>
<div id="fleetview" hidden></div><dialog id="lightbox"></dialog>
<div id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    k.startsWith('on') ? el.addEventListener(k.slice(2), v) : el.setAttribute(k, v === true ? '' : v);
  }
  el.append(...kids.flat().filter(k => k != null && k !== false));
  return el;
};
const ago = t => {
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
};
const clock = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const dayOf = t => {
  const d = new Date(t), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
  return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
};
const fToC = f => (f - 32) * 5 / 9;

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg.slice(0, 240); t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 6000);
}

async function command(id, command, params = {}) {
  const r = await fetch(`/api/devices/${encodeURIComponent(id)}/command`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command, params }) });
  if (!r.ok) throw new Error((await r.text()).trim());
  return r.json();
}

let devices = [];
async function loadDevices() {
  try {
    const r = await fetch('/api/devices');
    if (!r.ok) throw new Error(await r.text());
    devices = await r.json();
    $('#status').textContent = 'updated ' + clock(Date.now());
  } catch (e) { $('#status').textContent = 'offline'; toast('Could not load devices: ' + e.message); return; }
  renderQuick(); renderCams();
}

// ---------- quick controls: garage + thermostat ----------
function renderQuick() {
  const q = $('#quick');
  const garages = devices.filter(d => d.kind === 'garage');
  const thermo = devices.find(d => d.kind === 'thermostat');
  // Don't rebuild a card while someone is mid-interaction with it.
  for (const g of garages) {
    const old = $(`[data-id="${CSS.escape(g.id)}"]`, q);
    if (old?.dataset.busy) continue;
    const card = garageCard(g);
    old ? old.replaceWith(card) : q.append(card);
  }
  if (thermo && !pending) {
    const old = $('.thermo', q), card = thermoCard(thermo);
    old ? old.replaceWith(card) : q.append(card);
  }
  for (const f of devices.filter(d => d.kind === 'fridge')) {
    const old = $(`[data-id="${CSS.escape(f.id)}"]`, q), card = fridgeCard(f);
    old ? old.replaceWith(card) : q.append(card);
  }
  for (const l of devices.filter(d => d.kind === 'laundry').sort((a, b) => b.room.localeCompare(a.room))) {
    const old = $(`[data-id="${CSS.escape(l.id)}"]`, q), card = laundryCard(l);
    old ? old.replaceWith(card) : q.append(card);
  }
}

function fridgeCard(f) {

      e.target.disabled = true;
      try { await postJSON('/api/smartthings/signin', {}); toastOK('Chrome is open on the server: connect with Screen Sharing to sign in.'); }
      catch (err) { toast(err.message); }
      loadDevices();
    } }, 'Sign in') : null);
  if (f.run === 'connect') return h('div', { class: 'card laundry', 'data-id': f.id },

  const open = (f.parts || []).filter(p => p.open);

  const drawer = (f.parts || []).find(p => p.mode);

    f.kwhMonth != null ? `${f.kwhMonth} kWh this month` + (f.kwhLast != null ? ` (${f.kwhLast} last)` : '') : '', ...(f.notes || [])].filter(Boolean).join(' · ');
  return h('div', { class: 'card laundry' + (open.length ? ' active' : ''), 'data-id': f.id },
    h('div', { class: 'glyph' }, '🧊'),
    h('div', { class: 'grow' },
      h('div', {}, h('span', { class: 'state', style: open.length ? 'color:var(--warn)' : '' },
        open.length ? open.map(p => `${p.name} door open${p.openMin ? ' ' + p.openMin + 'm' : ''}`).join(', ') : temps || f.label)),

          : 'Token renewal needs a SmartThings sign-in on the server. ',
        h('a', { href: '#', style: 'color:var(--accent)', onclick: async e => {
          e.preventDefault();
          try { await postJSON('/api/smartthings/signin', {}); toastOK('Chrome is open on the server: connect with Screen Sharing to sign in.'); }
          catch (err) { toast(err.message); }
          loadDevices();
        } }, 'Sign in')) : null));
}

function laundryCard(l) {
  const done = l.run === 'Done' || l.run.startsWith('Done');
  const left = l.remainMin != null ? (l.remainMin >= 60 ? `${Math.floor(l.remainMin / 60)}h ${l.remainMin % 60}m left` : `${l.remainMin} min left`) : '';
  const finished = lastEvent(l.id, ['done']);
  const waiting = l.waitSince && !l.active; // washer done, load not moved yet
  const idle = l.run === 'Off' && !waiting; // two cards that both just say "Off" don't say which is which
  return h('div', { class: 'card laundry' + (l.active ? ' active' : '') + (done || waiting ? ' done' : ''), 'data-id': l.id },
    h('div', { class: 'glyph' }, l.room === 'dryer' ? '♨️' : '🧺'),
    h('div', { class: 'grow' },
      waiting ? h('div', {}, h('span', { class: 'state', style: 'color:var(--warn)' }, 'Load waiting'), h('span', { class: 'dim' }, ' · done ' + ago(l.waitSince)))
        : h('div', {}, h('span', { class: 'state' }, idle ? l.label : l.run), left ? h('span', { class: 'dim' }, ' · ' + left) : null),
      h('div', { class: 'dim' }, idle ? 'Off' : l.label,
        !l.active && !waiting && finished ? ` · finished ${ago(finished.time)}` : '',
        waiting ? ' · move it to the dryer' : '',
        l.online ? '' : ' · not reporting'),
      l.problem ? h('div', { class: 'problem dim', style: 'color:var(--bad)' }, l.problem) : null),
    waiting ? h('button', { title: 'The load is out: skip the reminder', onclick: async e => {
      e.target.disabled = true;
      try { await postJSON('/api/laundry/emptied', {}); } catch (err) { toast(err.message); }
      loadDevices();
    } }, 'Moved it') : null);
}

function lastEvent(deviceId, kinds) {
  return events.find(e => e.deviceId === deviceId && (!kinds || kinds.includes(e.kind)));
}

// Without a door sensor the Tailwind can't know where the door is, so the card shows the
// garage camera's latest still and one Press button, then re-snaps so you see what happened.
function garageCam(g) {
  const cams = devices.filter(d => d.kind === 'camera' || d.kind === 'doorbell');
  return cams.find(c => g.camera && c.label === g.camera) || cams.find(c => /garage/i.test(c.label + ' ' + (c.room || '')));
}

function sensorlessGarageCard(g) {
  const cam = garageCam(g);
  const still = cam && stillFor(cam.id);
  const btn = h('button', { disabled: !!g.problem }, 'Press');
  const view = h('div', { class: 'gview', onclick: () => cam && openLiveFromCard(cam.id) },
    still ? h('img', { src: still.src, alt: '', title: 'Garage camera: tap for live view' }) : h('div', { class: 'dim' }, cam ? 'Tap to look' : 'No camera'),
    still ? h('span', { class: 'badge' }, ago(still.time)) : null);
  const card = h('div', { class: 'card garage nosensor', 'data-id': g.id },
    view,
    h('div', { class: 'gbar' },
      h('div', { class: 'grow' }, h('div', { class: 'name' }, g.label),
        g.problem ? h('div', { class: 'problem' }, g.door === 'unknown' && !g.online ? "Can't reach the Tailwind: " + g.problem : g.problem)
                  : h('div', { class: 'dim' }, 'Works like the wall button')),
      cam ? h('button', { class: 'icon', title: 'New still', onclick: () => snapOnce(cam.id) }, '📷') : null,
      btn));
  let armTimer;
  btn.addEventListener('click', async () => {
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = 'Tap to press'; card.dataset.busy = 1;
      armTimer = setTimeout(() => { delete card.dataset.busy; renderQuick(); }, 4000);
      return;
    }
    clearTimeout(armTimer);
    btn.disabled = true; btn.classList.remove('armed'); btn.textContent = 'Pressed…';
    try { await command(g.id, 'garage.press'); }
    catch (e) { toast(e.message); delete card.dataset.busy; renderQuick(); return; }
    // A door takes ~15s to travel; then take a fresh still so the card shows where it ended up.
    if (cam) { await new Promise(r => setTimeout(r, 15000)); await snapOnce(cam.id); }
    delete card.dataset.busy; loadDevices();
  });
  return card;
}

function garageCard(g) {
  if (g.noSensor) return sensorlessGarageCard(g);
  const last = lastEvent(g.id, ['opened', 'closed']);
  const known = g.door === 'open' || g.door === 'closed';
  const verb = g.door === 'open' ? 'close' : 'open';
  const btn = h('button', { disabled: !known || !!g.problem }, verb === 'open' ? 'Open' : 'Close');
  const card = h('div', { class: `card garage ${g.door}`, 'data-id': g.id },
    h('div', { class: 'glyph' }, g.door === 'open' ? '▲' : g.door === 'closed' ? '▼' : '?'),
    h('div', { class: 'grow' },
      h('div', { class: 'state' }, known ? (g.door === 'open' ? 'Open' : 'Closed') : 'Unknown'),
      h('div', { class: 'dim' }, g.label, last ? ' · since ' + clock(last.time) : ''),
      g.problem ? h('div', { class: 'problem' }, g.door === 'unknown' ? "Can't reach the controller: " + g.problem : g.problem) : null),
    btn);
  // A garage door is not a light switch: first tap arms, second tap within 4s sends.
  let armTimer;
  btn.addEventListener('click', async () => {
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = `Tap to ${verb}`; card.dataset.busy = 1;
      armTimer = setTimeout(() => { delete card.dataset.busy; renderQuick(); }, 4000);
      return;
    }
    clearTimeout(armTimer);
    btn.disabled = true; btn.classList.remove('armed'); btn.textContent = verb === 'open' ? 'Opening…' : 'Closing…';
    try { await command(g.id, 'garage.' + verb); }
    catch (e) { toast(e.message); }
    // The door takes ~15s to travel; poll until it reports the new state (or give up).
    for (let i = 0; i < 10; i++) {
      await new Promise(r => setTimeout(r, 3000));
      await loadDevices();
      const now = devices.find(d => d.id === g.id);
      if (now && now.door !== g.door) break;
    }
    delete card.dataset.busy; renderQuick();
  });
  return card;
}

function thermoCard(t) {
  const eco = t.eco === 'MANUAL_ECO';
  const action = t.hvac === 'HEATING' ? 'heating' : t.hvac === 'COOLING' ? 'cooling' : 'idle';
  const row = (cls, label, val, key) => val == null || eco ? null : h('div', { class: 'sp ' + cls },
    h('button', { onclick: () => nudge(t, key, -1), 'aria-label': label + ' down' }, '−'),
    h('div', {}, h('div', { class: 'dim', style: 'text-align:center' }, label), h('div', { class: 'val' }, Math.round(val) + '°')),
    h('button', { onclick: () => nudge(t, key, +1), 'aria-label': label + ' up' }, '+'));
  const off = t.mode === 'OFF';
  return h('div', { class: 'card thermo', 'data-id': t.id },
    h('div', { class: 'top' },
      h('div', { class: 'now' }, t.tempF != null ? Math.round(t.tempF) + '°' : '—'),
      h('div', {},
        h('div', { class: 'act ' + action }, eco ? 'Eco' : off ? 'Off' : action[0].toUpperCase() + action.slice(1)),
        h('div', { class: 'dim' }, t.label, t.humidity != null ? ` · ${t.humidity}% RH` : '', t.online ? '' : ' · OFFLINE'))),
    (t.mode === 'HEAT' || t.mode === 'HEATCOOL') ? row('heat', 'heat to', t.heatF, 'heat') : null,
    (t.mode === 'COOL' || t.mode === 'HEATCOOL') ? row('cool', 'cool to', t.coolF, 'cool') : null,
    h('div', { class: 'modes' },
      (t.modes || []).map(m => h('button', { class: m === t.mode && !eco ? 'on' : null, onclick: () => setMode(t, m) }, m === 'HEATCOOL' ? 'Heat·Cool' : m[0] + m.slice(1).toLowerCase())),
      h('button', { class: eco ? 'on' : null, onclick: () => setEco(t, !eco) }, 'Eco')),
    thermoHistory());
}

// 24 hours of indoor temperature, setpoint and outside, with heating/cooling shaded.
function thermoHistory() {
  const th = homeData?.thermostat;
  if (!th || th.samples.length < 2) return th ? h('div', { class: 'hist dim' }, 'History starts building now: check back in an hour.') : null;
  const S = th.samples, W = 300, H = 90, pad = 2;
  const t1 = Date.now(), t0 = Math.max(t1 - 24 * 3600e3, new Date(S[0].t).getTime()); // until there's a day of history, span what we have
  const span = t1 - t0 < 23 * 3600e3 ? 'Since ' + (new Date(t0).toDateString() === new Date().toDateString() ? '' : 'yesterday ') + clock(t0) : 'Last 24 h';
  // Scale to inside and setpoints; in a Montana winter the outside line would flatten them.
  const vals = S.flatMap(s => [s.in, s.mode === 'HEAT' || s.mode === 'HEATCOOL' ? s.heat : null, s.mode === 'COOL' || s.mode === 'HEATCOOL' ? s.cool : null]).filter(v => v != null);
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  if (hi - lo < 8) { const m = (hi + lo) / 2; lo = m - 4; hi = m + 4; }
  const outs = S.map(s => s.out).filter(v => v != null);
  const outInRange = outs.length && Math.min(...outs) >= lo - 2 && Math.max(...outs) <= hi + 2;
  const x = t => pad + (W - 2 * pad) * (Math.max(t0, new Date(t)) - t0) / (t1 - t0);
  const y = v => pad + (H - 2 * pad - 9) * (1 - (v - lo) / (hi - lo)); // keep clear of the heating strip
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, a) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img', 'aria-label': 'Temperature over the last 24 hours' });
  // Heating/cooling spans: each sample's status lasts until the next.
  S.forEach((s, i) => {
    if (s.hvac !== 'HEATING' && s.hvac !== 'COOLING') return;
    const a = x(s.t), b = x(i + 1 < S.length ? S[i + 1].t : t1);
    if (b > a) svg.append(el('rect', { x: a, y: H - 6, width: b - a + 0.5, height: 6, fill: s.hvac === 'HEATING' ? 'rgba(255,122,89,.75)' : 'rgba(89,182,255,.75)' })); // a strip along the bottom, not full-height stripes
  });
  const line = (key, color, dash, ok = () => true) => {
    let d = '', prev = null;
    S.forEach((s, i) => {
      const v = ok(s) ? s[key] : null;
      if (v == null) { prev = null; return; }
      const X = x(s.t), Y = y(v);
      d += prev == null ? `M${X},${Y}` : `H${X}V${Y}`; // step: a reading holds until the next
      prev = v;
      if (i === S.length - 1) d += `H${x(t1)}`;
    });
    if (d) svg.append(el('path', { d, fill: 'none', stroke: color, 'stroke-width': key === 'in' ? 2 : 1.3, 'stroke-dasharray': dash || '', 'vector-effect': 'non-scaling-stroke' }));
  };
  if (outInRange) line('out', '#8b95a3', '2 3');
  line('heat', '#ff7a59', '4 3', s => s.mode === 'HEAT' || s.mode === 'HEATCOOL');
  line('cool', '#59b6ff', '4 3', s => s.mode === 'COOL' || s.mode === 'HEATCOOL');
  line('in', '#e6e9ee');
  const run = (m, what) => m ? `${what} ran ${m >= 60 ? Math.floor(m / 60) + 'h ' : ''}${m % 60}m` : '';
  const today = [run(th.heatTodayMin, 'Heat'), run(th.coolTodayMin, 'AC')].filter(Boolean).join(' · ') || 'Heat hasn\'t run';
  const yest = [run(th.heatYesterdayMin, 'heat'), run(th.coolYesterdayMin, 'AC')].filter(Boolean).join(', ');
  const outText = outs.length && !outInRange ? `outside ${Math.round(Math.min(...outs))}°–${Math.round(Math.max(...outs))}°` : null;
  return h('div', { class: 'hist' },
    h('div', { class: 'dim', style: 'display:flex;justify-content:space-between' }, h('span', {}, span), h('span', {}, `${lo}° – ${hi}°`)),
    svg,
    h('div', { class: 'legend' },
      h('span', {}, h('i', { style: 'background:#e6e9ee' }), 'inside'),
      h('span', {}, h('i', { style: 'background:#ff7a59' }), 'set to · heating'),
      outInRange ? h('span', {}, h('i', { style: 'background:#8b95a3' }), 'outside') : outText ? h('span', {}, outText) : null,
      h('span', { style: 'margin-left:auto' }, today + ' today' + (yest ? ` · yesterday ${yest}` : ''))));
}

let nudgeTimer, pending = null;
function nudge(t, key, delta) {
  // Batch rapid taps into one API call (SDM rate-limits thermostat commands).
  pending = pending || { heat: t.heatF, cool: t.coolF };
  pending[key] = Math.round(pending[key]) + delta;
  if (t.mode === 'HEATCOOL' && pending.cool - pending.heat < 3) { pending[key] -= delta; return; }
  t.heatF = pending.heat; t.coolF = pending.cool;
  $('.thermo').replaceWith(thermoCard(t));
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(async () => {
    const p = pending;
    try {
      if (t.mode === 'HEATCOOL') await command(t.id, 'sdm.devices.commands.ThermostatTemperatureSetpoint.SetRange', { heatCelsius: fToC(p.heat), coolCelsius: fToC(p.cool) });
      else if (t.mode === 'HEAT') await command(t.id, 'sdm.devices.commands.ThermostatTemperatureSetpoint.SetHeat', { heatCelsius: fToC(p.heat) });
      else if (t.mode === 'COOL') await command(t.id, 'sdm.devices.commands.ThermostatTemperatureSetpoint.SetCool', { coolCelsius: fToC(p.cool) });
    } catch (e) { toast(e.message); }
    pending = null;
    setTimeout(loadDevices, 1500);
  }, 1200);
}
async function setMode(t, mode) {
  try {
    if (t.eco === 'MANUAL_ECO') await command(t.id, 'sdm.devices.commands.ThermostatEco.SetMode', { mode: 'OFF' });
    await command(t.id, 'sdm.devices.commands.ThermostatMode.SetMode', { mode });
  } catch (e) { toast(e.message); }
  setTimeout(loadDevices, 1500);
}
async function setEco(t, on) {
  try { await command(t.id, 'sdm.devices.commands.ThermostatEco.SetMode', { mode: on ? 'MANUAL_ECO' : 'OFF' }); } catch (e) { toast(e.message); }
  setTimeout(loadDevices, 1500);
}

// ---------- at a glance: weather, calendar, internet, printer, chime ----------
let homeData = null;
async function loadHome() {
  try {
    const r = await fetch('/api/home');
    if (!r.ok) return;
    homeData = await r.json();
  } catch { return; }
  renderGlance();
  if (!pending) { const t = devices.find(d => d.kind === 'thermostat'); const old = $('.thermo'); if (t && old) old.replaceWith(thermoCard(t)); }
}

function renderGlance() {
  const g = $('#glance'), d = homeData;
  if (!d) return;
  const kids = [];
  if (d.weather) kids.push(weatherCard(d.weather));
  if (d.calendar) kids.push(calendarCard(d.calendar));
  const st = statusRow(d); st.classList.add('wide'); kids.push(st);
  if (d.setup?.length) kids.push(h('div', { class: 'setup wide' }, 'Not set up yet: ' + d.setup.join(', ') + ' (see README)'));
  g.replaceChildren(...kids);
}

function weatherCard(w) {
  const now = w.now || {};
  return h('div', { class: 'card wx' },
    h('div', { class: 'top' },
      h('div', { class: 'now' }, now.tempF != null ? Math.round(now.tempF) + '°' : '—'),
      h('div', {},
        h('div', {}, now.text || (w.periods?.[0]?.text ?? '')),
        h('div', { class: 'dim' }, 'Outside', w.city ? ' · ' + w.city : '', now.windMph ? ` · wind ${now.windMph} mph` : '', w.error ? ' · stale' : ''))),
    w.periods?.length ? h('div', { class: 'periods' }, w.periods.slice(0, 4).map(p =>
      h('div', { class: 'p' + (p.day ? '' : ' night') },
        h('div', { class: 'dim' }, p.name.replace('This ', '').replace('Afternoon', 'Today')),
        h('b', {}, Math.round(p.tempF) + '°'),
        h('div', { class: 'dim', title: p.text }, shortSky(p.text) + (p.precip >= 20 ? ` · ${p.precip}%` : ''))))) : null);
}
const shortSky = t => t.length > 18 ? t.split(/ then |,| and /i)[0].slice(0, 18) : t;

function calendarCard(c) {
  const rows = []; let day = null;
  const now = Date.now();
  for (const e of c.events.slice(0, 14)) {
    const d = calDay(e.start);
    if (d !== day) { rows.push(h('div', { class: 'd' }, d)); day = d; }
    rows.push(h('div', { class: 'e' + (e.chore ? ' chore' : '') + (!e.allDay && new Date(e.end) < now ? ' past' : '') },
      h('div', { class: 't' }, e.allDay ? (e.chore ? '🗑️' : 'all day') : clock(e.start)),
      h('div', {}, e.title, e.location ? h('div', { class: 'dim' }, e.location.split('\n')[0]) : null)));
  }
  if (!rows.length) rows.push(h('div', { class: 'dim' }, 'Nothing on the calendar this week.'));
  if (c.errors?.length) rows.push(h('div', { class: 'dim', style: 'color:var(--bad);margin-top:8px' }, 'Couldn’t refresh: ' + c.errors.join('; ')));
  return h('div', { class: 'card cal' }, ...rows);
}
// calDay labels upcoming days: Today, Tomorrow, then "Thursday, Nov 26". Something that
// started earlier and is still going counts as today.
const calDay = t => {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(t).setHours(0, 0, 0, 0) - today) / 864e5);
  return diff <= 0 ? 'Today' : diff === 1 ? 'Tomorrow' : new Date(t).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
};

function statusRow(d) {
  const cards = [];
  if (d.net || d.internet) cards.push(networkCard(d.net, d.internet));
  const p = d.printer;
  if (p) {
    // The printer decides when ink is "low"; name the emptiest ones when it says so.
    const warn = (p.reasons || []).some(r => /marker-supply-(low|empty)/.test(r));
    const known = (p.markers || []).filter(m => m.level >= 0);
    const floor = Math.min(...known.map(m => m.level));

// speedTest runs in this browser against Cloudflare's public test endpoints: the server's
// own Wi-Fi is too weak to measure the internet, but the device you're holding isn't.
async function speedTest(e) {
  const b = e.target; b.disabled = true;
  const base = 'https://speed.cloudflare.com';
  const timed = async (fn) => { const t = performance.now(); await fn(); return (performance.now() - t) / 1000; };
  try {
    b.textContent = 'ping…';
    const pings = [];
    for (let i = 0; i < 5; i++) pings.push(await timed(() => fetch(`${base}/__down?bytes=0`, { cache: 'no-store' }).then(r => r.arrayBuffer())));
    const pingMs = Math.round(Math.min(...pings) * 1000);
    b.textContent = 'download…';
    const downBytes = 25e6;
    await fetch(`${base}/__down?bytes=1000000`, { cache: 'no-store' }).then(r => r.arrayBuffer()); // warm up the connection
    const dt = await timed(() => fetch(`${base}/__down?bytes=${downBytes}`, { cache: 'no-store' }).then(r => r.arrayBuffer()));
    b.textContent = 'upload…';
    const upBytes = 10e6, blob = new Blob([new Uint8Array(upBytes)]);
    const ut = await timed(() => fetch(`${base}/__up`, { method: 'POST', body: blob, cache: 'no-store' }).then(r => r.text()));
    const res = { down: downBytes * 8 / dt / 1e6, up: upBytes * 8 / ut / 1e6, pingMs };
    await postJSON('/api/internet/speed', res);
    toastOK(`${Math.round(res.down)} Mbps down · ${Math.round(res.up)} up · ${pingMs} ms`);
  } catch (err) { toast('Speed test failed: ' + err.message); }
  b.disabled = false; b.textContent = 'Speed test';
  loadHome(); if (location.hash === '#network') loadHealth();
}

// unitBlock: one Google/Nest Wifi unit. Points get a 24-hour answered/missed strip and

// netChart: internet round-trip over 24 h, the Wi-Fi hop under it, loss as red ticks

function netChart(S, outages) {
  const W = 600, H = 120, t1 = Date.now(), t0 = t1 - 24 * 3600e3;

  for (const g of [0.25, 0.5, 0.75]) svg.append(el('line', { x1: 0, x2: W, y1: y(hi * g), y2: y(hi * g), stroke: '#2a313b', 'vector-effect': 'non-scaling-stroke' }));

      prevT = t;

}

function showStill(id) {

async function startLive(id) {
  const card = $(`[data-id="${CSS.escape(id)}"]`), err = $('.err', card), view = $('.view', card);
  err.textContent = '';
  view.append(h('span', { class: 'badge live' }, 'CONNECTING'));
  // Nest wants an offer with audio, video (both receive-only) and a data channel, in that order.
  const pc = new RTCPeerConnection();
  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.createDataChannel('dataSendChannel');
  const video = h('video', { autoplay: true, playsinline: true, muted: true });
  video.muted = true;
  video.addEventListener('playing', () => setTimeout(() => grab(id), 2000), { once: true });
  const ms = new MediaStream();
  pc.ontrack = e => { ms.addTrack(e.track); video.srcObject = ms; };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') { err.textContent = 'stream dropped'; stopLive(id); } };
  streams[id] = { pc, video, sessionId: null, timer: null };
  try {
    await pc.setLocalDescription(await pc.createOffer());
    const res = await command(id, 'sdm.devices.commands.CameraLiveStream.GenerateWebRtcStream', { offerSdp: pc.localDescription.sdp });
    if (!streams[id]) { command(id, 'sdm.devices.commands.CameraLiveStream.StopWebRtcStream', { mediaSessionId: res.mediaSessionId }).catch(() => {}); return; }
    await pc.setRemoteDescription({ type: 'answer', sdp: res.answerSdp });
    streams[id].sessionId = res.mediaSessionId;
    // Streams expire after 5 minutes unless extended.
    streams[id].timer = setInterval(async () => {
      try { const r = await command(id, 'sdm.devices.commands.CameraLiveStream.ExtendWebRtcStream', { mediaSessionId: streams[id].sessionId }); streams[id].sessionId = r.mediaSessionId || streams[id].sessionId; }
      catch (e) { err.textContent = 'extend failed: ' + e.message; stopLive(id); }
    }, 4 * 60 * 1000);
    view.replaceChildren(video, h('span', { class: 'badge live' }, 'LIVE'));
    card.classList.add('live');
    // Watching a camera refreshes its still: once the picture settles, then every minute.
    streams[id].snapTimer = setInterval(() => grab(id), 60 * 1000);
    $('.mute', card).textContent = '🔇';
  } catch (e) {
    pc.close(); delete streams[id]; showStill(id);
    err.textContent = e.message.slice(0, 200);
  }
}

function stopLive(id) {
  const s = streams[id]; if (!s) return;
  if (!s.noFinalGrab) grab(id); // last look before hanging up
  clearInterval(s.timer); clearInterval(s.snapTimer); s.pc.close(); delete streams[id];
  if (s.sessionId) command(id, 'sdm.devices.commands.CameraLiveStream.StopWebRtcStream', { mediaSessionId: s.sessionId }).catch(() => {});
  const card = $(`[data-id="${CSS.escape(id)}"]`); card?.classList.remove('live');
  showStill(id);
}
// ---------- stills ----------
let snaps = {}; // deviceId -> {media, time}, frames grabbed from live view
async function loadSnaps() { try { snaps = await (await fetch('/api/snapshots')).json(); } catch {} }

// stillFor picks the newest picture we have of a camera: a grabbed frame or an event clip/image.
function stillFor(id) {
  const s = snaps[id];
  const ev = events.find(e => e.deviceId === id && e.media);
  const fromSnap = s && { src: '/media/' + s.media + '?t=' + encodeURIComponent(s.time), time: s.time };
  const fromEv = ev && { src: '/media/' + ev.media, time: ev.time, video: ev.media.endsWith('.mp4'), label: label(ev) };
  if (fromSnap && fromEv) return new Date(fromSnap.time) >= new Date(fromEv.time) ? fromSnap : fromEv;
  return fromSnap || fromEv || null;
}

// isBlack: a stream's first frames (and a camera switched off) decode as solid black.
// Night vision is dim but never this flat, so these are safe to throw away.
function isBlack(c) {
  const t = document.createElement('canvas'); t.width = 32; t.height = 18;
  const x = t.getContext('2d'); x.drawImage(c, 0, 0, 32, 18);
  const d = x.getImageData(0, 0, 32, 18).data;
  let max = 0, sum = 0;
  for (let i = 0; i < d.length; i += 4) { const l = (d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10; sum += l; if (l > max) max = l; }
  return max < 24 && sum / (d.length / 4) < 8;
}

// grab draws the current live frame to a canvas and uploads it as the camera's still,
// and as the picture for eventId when given.
function grab(id, eventId) {
  const v = streams[id]?.video;
  if (!v || !v.videoWidth) return Promise.resolve(false);
  const c = document.createElement('canvas');
  const scale = Math.min(1, 1280 / v.videoWidth);
  c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  if (isBlack(c)) return Promise.resolve(false);
  const q = eventId ? '?event=' + encodeURIComponent(eventId) : '';
  return new Promise(resolve => c.toBlob(async blob => {
    if (!blob) return resolve(false);
    try {
      const r = await fetch(`/api/devices/${encodeURIComponent(id)}/snapshot${q}`, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
      if (r.ok) { snaps[id] = await r.json(); refreshStills(id); }
      resolve(r.ok);
    } catch { resolve(false); }
  }, 'image/jpeg', 0.82));
}

function refreshStills(id) {
  if (!streams[id]) showStill(id);
  if (devices.some(d => d.kind === 'garage' && d.noSensor)) renderQuick();
}

// snapOnce opens a stream just long enough to get a frame, then hangs up.
// With eventId the frame also becomes that event's picture, and failures stay quiet.
const snapping = new Set();
async function snapOnce(id, eventId) {
  if (streams[id]) return grabUntil(id, eventId, 4);
  if (snapping.has(id)) return false;
  snapping.add(id);
  const card = $(`[data-id="${CSS.escape(id)}"].cam`);
  card?.classList.add('busy');
  let ok = false;
  try {
    await startLive(id);
    for (let i = 0; i < 30 && streams[id] && !streams[id].video.videoWidth; i++) await new Promise(r => setTimeout(r, 500));
    await new Promise(r => setTimeout(r, 1500)); // let exposure settle after the first frame
    ok = await grabUntil(id, eventId, 6);
    if (!ok && !eventId) toast('No picture from that camera: the frame was black (is the camera switched off?).');
    if (streams[id]) streams[id].noFinalGrab = true;
  } finally {
    stopLive(id);
    card?.classList.remove('busy');
    snapping.delete(id);
  }
  return ok;
}

// grabUntil retries while the stream is still showing black, a second apart.
async function grabUntil(id, eventId, tries) {
  for (let i = 0; i < tries && streams[id]; i++) {
    if (await grab(id, eventId)) return true;
    await new Promise(r => setTimeout(r, 1000));
  }
  return false;
}

// A person (or the doorbell) on a camera Google won't give pictures for: grab one from the
// live stream while they're probably still in frame. The server runs a headless copy of
// this page (?capture) that does this around the clock; an open tab only steps in if that
// copy hasn't managed it within a few seconds.
const CAPTURE = new URLSearchParams(location.search).has('capture');
const pictured = new Set();
async function pictureFor(ev) {
  if (ev.media || pictured.has(ev.id) || (document.hidden && !CAPTURE)) return; // the server's copy is never "visible"; a tab in someone's pocket is
  const dev = devices.find(d => d.id === ev.deviceId);
  if (!dev || dev.kind !== 'camera') return; // the doorbell sends its own clip
  if (Date.now() - new Date(ev.time) > 60 * 1000) return;
  const wanted = ['person', 'chime'].includes(ev.kind) ||
    (CAPTURE && ev.kind === 'motion' && stillAge(ev.deviceId) > 10 * 60 * 1000); // motion: just keep the still current
  if (!wanted) return;
  pictured.add(ev.id);
  if (!CAPTURE) {
    await new Promise(r => setTimeout(r, 12000));
    if (events.find(e => e.id === ev.id)?.media) return;
  }
  ev.kind === 'motion' ? snapOnce(ev.deviceId) : snapOnce(ev.deviceId, ev.id);
}
const stillAge = id => { const s = stillFor(id); return s ? Date.now() - new Date(s.time) : Infinity; };

// Capture mode keeps every camera's still under an hour old, one camera at a time
// (Google rate-limits stream starts).
if (CAPTURE) setInterval(() => {
  const cams = devices.filter(d => d.kind === 'camera' && d.live && !streams[d.id] && !snapping.has(d.id));
  const oldest = cams.sort((a, b) => stillAge(b.id) - stillAge(a.id))[0];
  if (oldest && stillAge(oldest.id) > 60 * 60 * 1000) snapOnce(oldest.id);
}, 3 * 60 * 1000);

function openLiveFromCard(id) {
  const card = $(`[data-id="${CSS.escape(id)}"].cam`);
  card?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (!streams[id]) startLive(id);
}

function toggleMute(id) {
  const s = streams[id]; if (!s) return;
  s.video.muted = !s.video.muted;
  $(`[data-id="${CSS.escape(id)}"] .mute`).textContent = s.video.muted ? '🔇' : '🔊';
}
function fullscreen(id) {
  const v = streams[id]?.video; if (!v) return;
  (v.requestFullscreen || v.webkitEnterFullscreen || (() => {})).call(v);
}
// Phones park the tab when you switch apps; don't leave Google streaming into the void.
addEventListener('pagehide', () => Object.keys(streams).forEach(stopLive));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) Object.keys(streams).forEach(stopLive);
  else { loadDevices(); reloadEvents(); loadHome(); }
});

// ---------- activity ----------
let events = []; // newest first
let filter = localStorage.getItem('feedFilter') || 'key';
const KEY = new Set(['chime', 'person', 'clip', 'opened', 'closed', 'done', 'reminder', 'internet', 'network', 'fridge', 'fleet']);
const ICON = { chime: '🔔', person: '🚶', motion: '〰️', sound: '🔊', clip: '🎬', opened: '▲', closed: '▼', done: '🧺', reminder: '🗑️', internet: '🌐', network: '📡', fridge: '🧊', fleet: '☁️', signin: '🔑' };
const label = ev => ({ chime: 'Doorbell', person: 'Person', motion: 'Motion', sound: 'Sound', clip: 'Clip', opened: 'Opened', closed: 'Closed', done: 'Laundry done', reminder: 'Reminder', internet: 'Internet', network: 'Network', fridge: 'Fridge', fleet: 'Fleet', signin: 'Signed in' })[ev.kind] || ev.kind;

// A new phone or gadget on the Wi-Fi is worth a line under All, not the Important view.
const important = e => KEY.has(e.kind) && !(e.kind === 'network' && /^New device joined/.test(e.device));

function upsertEvent(ev) {
  events = [ev, ...events.filter(e => e.id !== ev.id)].sort((a, b) => new Date(b.time) - new Date(a.time));
}

function renderFeed() {
  const feed = $('#feed');
  const shown = events.filter(e => filter === 'all' || important(e));
  if (!shown.length) {
    feed.replaceChildren(h('div', { class: 'empty' }, filter === 'all' ? 'No events yet.' : 'Nothing important yet. Motion and sound are under All.'));
    return;
  }
  const rows = []; let day = null;
  for (const ev of shown) {
    const d = dayOf(ev.time);
    if (d !== day) { rows.push(h('div', { class: 'day' }, d)); day = d; }
    let thumb;
    if (ev.media) {
      const isVid = ev.media.endsWith('.mp4');
      thumb = h('div', { class: 'thumb media', onclick: () => openMedia(ev) },
        isVid ? h('video', { src: '/media/' + ev.media + '#t=0.5', muted: true, playsinline: true, preload: 'metadata', class: 'thumb' })
              : h('img', { src: '/media/' + ev.media, loading: 'lazy', alt: '', class: 'thumb' }),
        isVid ? h('span', { class: 'tag' }, '▶') : null);
    } else thumb = h('div', { class: 'thumb icon' }, ICON[ev.kind] || '•');
    rows.push(h('div', { class: 'ev' },
      thumb,
      h('div', { class: 'grow' },
        h('div', { class: 'kind ' + ev.kind }, label(ev), ev.count > 1 ? h('span', { class: 'dim' }, ` ×${ev.count}`) : null),
        h('div', { class: 'dim' }, ev.device)),
      h('div', { class: 'when' }, clock(ev.time), h('br'), h('span', { 'data-ago': ev.time }, ago(ev.time)))));
  }
  feed.replaceChildren(...rows);
}

function openMedia(ev) {
  const box = $('#lightbox');
  box.replaceChildren(
    ev.media.endsWith('.mp4') ? h('video', { src: '/media/' + ev.media, controls: true, autoplay: true, playsinline: true }) : h('img', { src: '/media/' + ev.media, alt: '' }),
    h('div', { class: 'cap' }, h('span', {}, `${label(ev)} · ${ev.device}`), h('span', {}, new Date(ev.time).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }))));
  box.showModal();
}
$('#lightbox').addEventListener('click', e => { if (e.target.tagName !== 'VIDEO') e.currentTarget.close(); });
$('#lightbox').addEventListener('close', () => $('#lightbox').replaceChildren());

$$('.chips button').forEach(b => {
  b.classList.toggle('on', b.dataset.f === filter);
  b.addEventListener('click', () => {
    filter = b.dataset.f; localStorage.setItem('feedFilter', filter);
    $$('.chips button').forEach(x => x.classList.toggle('on', x === b));
    renderFeed();
  });
});

async function reloadEvents() {
  try { [events] = await Promise.all([fetch('/api/events').then(r => r.json()), loadSnaps()]); } catch { return; }
  renderFeed(); renderCams(); renderQuick();
}

function connectStream() {
  const es = new EventSource('/api/events/stream');
  let dropped = false;
  es.onopen = () => { $('#dot').className = 'dot on'; if (dropped) reloadEvents(); dropped = false; };
  es.onerror = () => { $('#dot').className = 'dot off'; dropped = true; };
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    upsertEvent(ev); renderFeed();
    if (!streams[ev.deviceId]) showStill(ev.deviceId);
    if (ev.kind === 'opened' || ev.kind === 'closed' || ev.kind === 'done' || ev.kind === 'fridge' || ev.kind === 'signin') loadDevices();
    if (ev.kind === 'internet' || ev.kind === 'reminder' || ev.kind === 'network') { loadHome(); if (location.hash === '#network') loadHealth(); }
    pictureFor(ev);
  };
}

// Keep "3m ago" honest without re-rendering media.
setInterval(() => {
  $$('[data-ago]').forEach(el => el.textContent = ago(el.dataset.ago));
  for (const card of $$('.cam')) {
    const last = events.find(e => e.deviceId === card.dataset.id);
    if (last) $('.sub', card).textContent = `${label(last)} · ${ago(last.time)}`;
  }
}, 60 * 1000);

// ---------- push alerts ----------
// Phones only allow push (and home-screen install) on https, which `tailscale serve` provides.
const pushOK = window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window;
let swReg = null;

async function initPush() {
  const bell = $('#bell');
  if (!pushOK) { bell.title = 'Alerts need the https:// address (tailscale serve)'; return; }
  try { swReg = await navigator.serviceWorker.register('/sw.js'); } catch (e) { bell.title = 'Service worker failed: ' + e.message; return; }
  const sub = await swReg.pushManager.getSubscription();
  setBell(!!sub && Notification.permission === 'granted');
}
function setBell(on) { const b = $('#bell'); b.textContent = on ? '🔔' : '🔕'; b.classList.toggle('on', on); }

function keyBytes(b64) {
  const s = atob(b64.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - b64.length % 4) % 4));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
async function postJSON(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.text()).trim());
  return r.json();
}

$('#bell').addEventListener('click', async () => {
  if (!pushOK) {
    toast(window.isSecureContext ? "This browser doesn't support push alerts." : 'Alerts need the https:// address. On iPhone, add hometron to the Home Screen first.');
    return;
  }
  try {
    const existing = await swReg.pushManager.getSubscription();
    if (existing) {
      await postJSON('/api/push/unsubscribe', { endpoint: existing.endpoint }).catch(() => {});
      await existing.unsubscribe();
      setBell(false); toast('Alerts off on this device.');
      return;
    }
    if (await Notification.requestPermission() !== 'granted') { toast('Notifications are blocked for this site in the browser settings.'); return; }
    const { publicKey } = await (await fetch('/api/push/key')).json();
    const sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(publicKey) });
    await postJSON('/api/push/subscribe', { ...sub.toJSON(), kinds: ['chime', 'person'] });
    await postJSON('/api/push/test', { endpoint: sub.endpoint });
    setBell(true);
  } catch (e) { toast('Alerts: ' + e.message); }
});

// ---------- network ----------
const ROUTERISH = /google|asus|tp-?link|netgear|eero|linksys|ubiquiti|arris|technicolor|sagemcom|cisco|mikrotik/i;
async function loadNetwork(rescan) {
  $('#netsum').textContent = rescan ? 'Scanning… (about 5 seconds)' : 'Loading…';
  $('#rescan').disabled = true;
  try {
    const r = rescan ? await fetch('/api/network/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
                     : await fetch('/api/network');
    if (!r.ok) throw new Error(await r.text());
    renderNetwork(await r.json());
  } catch (e) { $('#netsum').textContent = 'Scan failed: ' + e.message; }
  $('#rescan').disabled = false;
}

function hostRow(x, gone) {
  const routerish = !x.gateway && !x.self && ROUTERISH.test(x.vendor || '');
  const who = x.private ? 'Phone / laptop / VM (private MAC)' : (x.vendor || 'Unknown maker');
  const seen = gone ? 'last ' + ago(x.lastSeen) : 'since ' + new Date(x.firstSeen).toLocaleDateString([], { month: 'short', day: 'numeric' });
  return h('tr', {},
    h('td', {},
      h('div', {}, x.name || who,
        x.tailwind ? h('span', { class: 'tag tw' }, 'TAILWIND') : null,
        x.gateway ? h('span', { class: 'tag rt' }, 'gateway') : null,
        routerish ? h('span', { class: 'tag rt' }, 'router?') : null,
        x.self ? h('span', { class: 'tag' }, 'this server') : null,
        x.web && !x.tailwind ? h('span', { class: 'tag' }, 'web') : null),
      x.name ? h('div', { class: 'dim' }, who) : null),
    h('td', { class: 'mono' }, x.web ? h('a', { href: 'http://' + x.ip + '/', target: '_blank', rel: 'noopener', style: 'color:inherit' }, x.ip) : x.ip),
    h('td', { class: 'mono mac' }, x.mac),
    h('td', { class: 'dim' }, seen));
}

function renderNetwork(s) {
  if (s.error) { $('#netsum').textContent = 'Scan failed: ' + s.error; return; }
  const gw = s.hosts.find(x => x.gateway);
  $('#netsum').textContent = [`${s.hosts.length} devices on ${s.address} (${s.interface})`, `gateway ${s.gateway}` + (gw && gw.vendor ? ' · ' + gw.vendor : ''), `scanned ${ago(s.at)} in ${s.took}`].join(' · ');
  const tw = s.hosts.find(x => x.tailwind);
  const routers = s.hosts.filter(x => !x.gateway && !x.self && ROUTERISH.test(x.vendor || ''));
  let hint;
  if (tw) hint = h('div', { class: 'hint good' }, 'Found a Tailwind at ' + tw.ip + '. Put that IP and its Local Control Key in tailwind.json on the server.');
  else {
    let msg = 'No Tailwind answering on ' + s.address + '. hometron only sees the network this server is connected to.';
    if (routers.length) msg += ' ' + routers.map(r => r.vendor + ' at ' + r.ip).join(', ') + (routers.length === 1 ? ' looks' : ' look') +
      ' like another router: everything connected through it is hidden from here and shows up as that one device.';
    hint = h('div', { class: 'hint' }, msg);
  }
  $('#nethint').replaceChildren(hint);
  $('#nethosts').replaceChildren(...s.hosts.map(x => hostRow(x, false)));
  const gone = s.gone || [];
  $('#netgone').replaceChildren(...(gone.length ? gone.map(x => hostRow(x, true)) : [h('tr', {}, h('td', { class: 'dim' }, 'Nothing has dropped off.'))]));
}
$('#rescan').addEventListener('click', () => loadNetwork(true));
// One camera at a time: each needs its own stream, and Google rate-limits stream starts.
$('#snapall').addEventListener('click', async e => {
  const b = e.currentTarget; b.disabled = true;
  const cams = $$('.cam').map(c => c.dataset.id).filter(id => !streams[id]);
  for (let i = 0; i < cams.length; i++) { b.textContent = '📷 ' + (i + 1) + '/' + cams.length; await snapOnce(cams[i]); }
  b.textContent = '📷 Refresh stills'; b.disabled = false;
});


// ---------- fleet: sites, domains, cloud inventory ----------
let fleetData = null;
async function loadFleet() {
  try { const r = await fetch('/api/fleet'); if (r.ok) fleetData = await r.json(); } catch { return; }
  renderFleet();
}
const usd = v => '$' + (v >= 100 ? Math.round(v) : v.toFixed(v % 1 ? 2 : 0));
const daysTo = d => Math.round((new Date(d + 'T12:00:00') - Date.now()) / 864e5);

function renderFleet() {
  const f = fleetData, root = $('#fleetview');
  if (!f) return;
  if (f.setup) { root.replaceChildren(h('div', { class: 'hint' }, 'Fleet isn’t set up: add fleet.json to the state folder (see README).')); return; }
  const inv = f.inventory || {}, sites = f.sites || [], res = inv.resources || [];
  const fresh = inv.at && !inv.at.startsWith("0001");
  const down = sites.filter(s => !s.up);
  const sugg = inv.suggestions || [];
  const fixed = (f.fixed || []).reduce((a, x) => a + x.usd, 0);
  const doLast = inv.doInvoices?.[0];
  const kids = [];

  // Summary line
  kids.push(h('div', { class: 'card fsum' },
    h('div', { class: 'big ' + (down.length ? 'bad' : 'ok') }, !sites.length ? "Checking sites…" : down.length ? `${down.length} down: ${down.map(s => s.name).join(", ")}` : `All ${sites.length} sites up`),
    h('div', { class: 'facts' },
      fact('Monthly', [doLast ? `DigitalOcean ${usd(doLast.usd)}` : null, fixed ? `subscriptions ${usd(fixed)}` : null, inv.workspace?.usd ? `Workspace ${usd(inv.workspace.usd)}` : null, 'Google Cloud: no billing export'].filter(Boolean).join(' · ')),
      inv.doMonthToDate != null ? fact('DO this month', usd(inv.doMonthToDate) + ' so far') : null,
      fact("Inventory", fresh ? `${res.filter(r => !r.infra).length} things · ${ago(inv.at)}` : 'taking inventory…',
        h('button', { class: 'icon', title: 'Take inventory again now', onclick: async e => { e.target.disabled = true; await postJSON('/api/fleet/refresh', {}); toastOK('Taking inventory: takes a minute.'); setTimeout(loadFleet, 60000); } }, '↻'))),
    f.missing?.length ? h('div', { class: 'dim', style: 'color:var(--warn)' }, 'Not connected: ' + f.missing.join(', ')) : null,
    inv.errors?.length ? h('details', { class: 'dim' }, h('summary', {}, `${inv.errors.length} thing(s) couldn’t be read`), h('ul', {}, inv.errors.map(e => h('li', {}, e)))) : null));

  // Suggestions
  if (sugg.length) {
    const order = { fix: 0, kill: 1, trim: 2, check: 3 };
    kids.push(h('h2', {}, 'Worth a look'), h('div', { class: 'card sugg' },
      [...sugg].sort((a, b) => order[a.level] - order[b.level]).map(s => h('div', { class: 's' },
        h('span', { class: 'lvl ' + s.level }, s.level), h('div', {}, h('div', {}, s.text), s.why ? h('div', { class: 'dim' }, s.why) : null)))));
  }

  // Sites
  kids.push(h('h2', {}, 'Sites ', h('span', { class: 'dim', style: 'text-transform:none;letter-spacing:0' }, 'checked every minute from home')),
    h('div', { class: 'card' }, h('table', { class: 'net fleet' },
      h('thead', {}, h('tr', {}, ['Site', 'Last 24 hours', 'Up 24h / 7d', 'Speed', 'Runs on', 'Cert'].map(t => h('th', {}, t)))),
      h('tbody', {}, sites.map(s => h('tr', { class: s.up ? '' : 'down' },
        h('td', {}, h('a', { href: s.url, target: '_blank', rel: 'noopener' }, s.name),
          h('div', { class: 'dim', style: s.up ? '' : 'color:var(--bad)' }, s.up ? (s.status ? 'HTTP ' + s.status : '') : (s.error || 'HTTP ' + s.status) + ' · since ' + clock(s.since))),
        h('td', {}, h('div', { class: 'strip' }, s.strip.map(v => h('i', { class: v < 0 ? 'none' : v >= 100 ? 'ok' : v >= 90 ? 'slow' : 'down', title: v < 0 ? 'no data' : v + '% up' })))),
        h('td', { class: 'mono' }, s.up24 != null ? pct(s.up24) : '—', ' / ', s.up7 != null ? pct(s.up7) : '—'),
        h('td', { class: 'mono' }, s.p50 ? s.p50 + ' ms' : '—'),
        h('td', {}, s.domain?.host || '', s.domain?.target ? h('div', { class: 'dim' }, s.domain.target) : null),
        h('td', { class: 'mono', style: s.certDays != null && s.certDays < 14 ? 'color:var(--warn)' : '' }, s.certDays != null ? s.certDays + 'd' : '—')))))));

  // Domains
  kids.push(h('h2', {}, 'Domains'), h('div', { class: 'card' }, h('table', { class: 'net' },
    h('thead', {}, h('tr', {}, ['Domain', 'Website', 'DNS', 'Email', 'Renews'].map(t => h('th', {}, t)))),
    h('tbody', {}, (f.domains || []).map(d => {
      const left = d.expires ? daysTo(d.expires) : null;
      return h('tr', {},
        h('td', {}, d.name),
        h('td', {}, d.host || h('span', { class: 'dim' }, 'none'), d.target ? h('div', { class: 'dim' }, d.target) : null),
        h('td', { class: 'dim' }, d.dns || ''),
        h('td', {}, d.mail ? '✓' : ''),
        h('td', { class: 'mono', style: left != null && left < 60 ? 'color:var(--warn)' : '' }, d.expires || '?', h('div', { class: 'dim' }, (d.registrar || '') + (d.rdapSource === 'registry' ? ' · registry' : ''))));
    })))));

  // Inventory, grouped by provider and project
  const groups = {};
  for (const r of res) (groups[r.provider + (r.project ? ' · ' + r.project : '')] ||= []).push(r);
  const projects = Object.fromEntries((inv.projects || []).map(p => [p.id, p]));
  kids.push(h('h2', {}, 'Inventory ', h('label', { class: 'dim', style: 'text-transform:none;letter-spacing:0;margin-left:8px' },
    h('input', { type: 'checkbox', checked: showInfra, onchange: e => { showInfra = e.target.checked; renderFleet(); } }), ' show platform leftovers')));
  const cards = [];
  for (const [name, rs] of Object.entries(groups)) {
    const p = projects[name.split(' · ')[1]];
    const shown = rs.filter(r => showInfra || !r.infra);
    const total = rs.reduce((a, r) => a + (r.usd || 0), 0);
    cards.push(h('div', { class: 'card inv' },
      h('div', { class: 'k' }, h('b', {}, name), h('span', { class: 'dim' },
        p ? [billWord(p), p.created ? ' · since ' + p.created.slice(0, 7) : ''].join('') : '', total ? ` · ${usd(total)}/mo` : '')),
      shown.length ? h('table', { class: 'net' }, h('tbody', {}, shown.map(r => h('tr', { class: r.infra ? 'infra' : '' },
        h('td', { class: 'dim', style: 'width:110px' }, r.kind),
        h('td', {}, r.url ? h('a', { href: r.url, target: '_blank', rel: 'noopener' }, r.name) : r.name, r.detail ? h('div', { class: 'dim' }, r.detail) : null),
        h('td', { class: 'dim' }, [r.state, r.usage].filter(Boolean).join(' · ')),
        h('td', { class: 'mono', style: 'text-align:right' }, r.usd ? usd(r.usd) + '/mo' : ''))))) : h('div', { class: 'dim', style: 'padding:8px 12px' }, (p?.notable?.length ? 'Nothing running, but uses: ' + p.notable.join(', ') : 'Nothing you made: only what Google creates by default.'))));
  }
  for (const p of inv.projects || []) if (!groups['Google Cloud · ' + p.id]) cards.push(h('div', { class: 'card inv' },
    h('div', { class: 'k' }, h('b', {}, 'Google Cloud · ' + p.id), h("span", { class: "dim" }, billWord(p))),
    h('div', { class: 'dim', style: 'padding:8px 12px' }, p.notable?.length ? `Nothing running, but uses: ${p.notable.join(", ")}` : `Empty: ${p.apis} API(s) turned on, nothing running.`)));
  const ws = inv.workspace;
  if (ws) cards.push(h('div', { class: 'card inv' },
    h('div', { class: 'k' }, h('b', {}, 'Google Workspace' + (ws.plan ? ' · ' + ws.plan : '')),
      h('span', { class: 'dim' }, `${ws.seats} seat${ws.seats === 1 ? '' : 's'}`, ws.usd ? ` · ${usd(ws.usd)}/mo` : ' · set workspace.usdPerUser in fleet.json for cost')),
    h('table', { class: 'net' }, h('tbody', {}, ws.users.map(u => {
      const apps = Object.entries(u.lastActive || {}).sort((a, b) => b[1].localeCompare(a[1])).slice(0, 3).map(([a, d]) => `${a} ${d}`).join(' · ');
      return h('tr', {},
        h('td', {}, u.name || u.email, h('div', { class: 'dim' }, u.email, u.admin ? ' · admin' : '', u.suspended ? ' · suspended' : '')),
        h('td', { class: 'dim' }, u.lastLogin ? 'signed in ' + u.lastLogin : 'never signed in', apps ? h('div', {}, 'last used: ' + apps) : null),
        h('td', { style: u.twoStep ? 'color:var(--ok)' : 'color:var(--bad)' }, u.twoStep ? '2SV ✓' : 'no 2SV'));
    }))),
    ws.asOf ? h('div', { class: 'dim', style: 'padding:6px 12px' }, `Activity from Google's usage report for ${ws.asOf} (it trails by a few days).`) : null));
  if (f.fixed?.length) cards.push(h('div', { class: 'card inv' }, h('div', { class: 'k' }, h('b', {}, 'Subscriptions'), h('span', { class: 'dim' }, usd(fixed) + '/mo')),
    h('table', { class: 'net' }, h('tbody', {}, f.fixed.map(x => h('tr', {}, h('td', {}, x.name, x.note ? h('div', { class: 'dim' }, x.note) : null), h('td', { class: 'mono', style: 'text-align:right' }, usd(x.usd) + '/mo')))))));
  kids.push(h('div', { class: 'invgrid' }, cards));
  root.replaceChildren(...kids);
}
const billWord = p => !p.billingKnown ? "" : p.billed ? (p.billing || "billed") : "no billing";
let showInfra = false;
const fact = (k, v, extra) => h('div', {}, h('div', { class: 'dim' }, k), h('div', {}, v, extra ? ' ' : '', extra || ''));

function showView() {
  const view = location.hash === '#network' ? 'network' : location.hash === '#fleet' ? 'fleet' : 'home';
  $('main').hidden = view !== 'home'; $('#netview').hidden = view !== 'network'; $('#fleetview').hidden = view !== 'fleet';
  $$('nav a').forEach(a => a.classList.toggle('on', a.dataset.view === view));
  if (view !== 'home') Object.keys(streams).forEach(stopLive);
  if (view === 'network') { loadNetwork(false); loadHealth(); }
  if (view === 'fleet') loadFleet();
}
addEventListener('hashchange', showView);
$('nav a[data-view="home"]').addEventListener('click', e => { e.preventDefault(); history.pushState(null, '', location.pathname); showView(); });

(async () => {
  showView();
  if (!CAPTURE) initPush();
  await reloadEvents();
  await loadDevices();
  loadHome();
  connectStream();
  setInterval(() => { if (!document.hidden) loadDevices(); }, 60 * 1000);
  setInterval(() => { if (!document.hidden) loadHome(); }, 2 * 60 * 1000);
  setInterval(() => { if (!document.hidden && location.hash === '#network') loadHealth(); }, 60 * 1000);  setInterval(() => { if (!document.hidden && location.hash === '#fleet') loadFleet(); }, 60 * 1000);
})();
</script>
</body>
